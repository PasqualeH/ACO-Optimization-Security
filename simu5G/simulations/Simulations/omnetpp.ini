**.gnb2.x2App[1].client.connectAddress = "gnb1%x2ppp0"
**.gnb2.x2App[2].client.connectAddress = "gnb3%x2ppp0"
**.gnb2.x2App[3].client.connectAddress = "gnb4%x2ppp0"

**.gnb3.x2App[0].client.connectAddress = "gnb0%x2ppp0"
