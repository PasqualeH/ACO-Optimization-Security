*.ue[21].app[0].destAddress = "server[21]"
*.ue[22].app[0].destAddress = "server[22]"
*.ue[23].app[0].destAddress = "server[23]"
*.ue[24].app[0].destAddress = "server[24]"

*.ue[13..24].app[0].destPort = 5000


