############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false
**.dynamicCellAssociation = true
**.enableHandover = true
#------------------------------------#

############### X2 configuration #################
**.gnb*.numX2Apps = 4 #9                                        # one x2App per peering node
**.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)

**.gnb0.x2App[0].client.connectAddress = "gnb1%x2ppp0"
**.gnb0.x2App[1].client.connectAddress = "gnb2%x2ppp0"
**.gnb0.x2App[2].client.connectAddress = "gnb3%x2ppp0"
**.gnb0.x2App[3].client.connectAddress = "gnb4%x2ppp0"

