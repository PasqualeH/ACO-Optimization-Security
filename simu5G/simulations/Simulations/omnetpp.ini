#============= Application Setup =============
*.server[*].numApps = 1
*.ue[*].numApps = 1

*.server[0..12].app[0].typename = "SimpleVoipReceiver"
*.server[13..24].app[0].typename = "UdpSink"

*.server[0..12].app[0].localPort = 3000+ancestorIndex(0)
*.server[13..24].app[0].localPort = 5000

*.ue[0..12].app[0].typename = "SimpleVoipSender"
*.ue[13..24].app[0].typename = "UdpBasicApp"

*.ue[0..12].app[0].talkPacketSize = 100B
*.ue[0..12].app[0].packetizationInterval = exponential(20ms)
*.ue[0..12].app[0].localPort = 4000+ancestorIndex(0)
*.ue[0..12].app[0].destPort = 3000+ancestorIndex(0)
*.ue[0..12].app[0].startTime = uniform(5s,10s)
*.ue[0..12].app[0].stopTime = uniform(12s,20s)

*.ue[0].app[0].destAddress = "server[0]"
*.ue[1].app[0].destAddress = "server[1]"
*.ue[2].app[0].destAddress = "server[2]"
*.ue[3].app[0].destAddress = "server[3]"
*.ue[4].app[0].destAddress = "server[4]"
*.ue[5].app[0].destAddress = "server[5]"
*.ue[6].app[0].destAddress = "server[6]"
*.ue[7].app[0].destAddress = "server[7]"
*.ue[8].app[0].destAddress = "server[8]"
*.ue[9].app[0].destAddress = "server[9]"
*.ue[10].app[0].destAddress = "server[10]"
*.ue[11].app[0].destAddress = "server[11]"
*.ue[12].app[0].destAddress = "server[12]"

*.ue[13..24].app[0].messageLength = 100byte
*.ue[13..24].app[0].sendInterval = exponential(5ms)
*.ue[13..24].app[0].startTime = uniform(5s,10s)
*.ue[13..24].app[0].stopTime = uniform(12s,20s)

*.ue[13].app[0].destAddress = "server[13]"
*.ue[14].app[0].destAddress = "server[14]"
*.ue[15].app[0].destAddress = "server[15]"
*.ue[16].app[0].destAddress = "server[16]"
*.ue[17].app[0].destAddress = "server[17]"
*.ue[18].app[0].destAddress = "server[18]"
*.ue[19].app[0].destAddress = "server[19]"
