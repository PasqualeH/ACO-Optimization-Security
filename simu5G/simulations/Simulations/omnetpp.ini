[General]
image-path=../../../images
output-scalar-file-append = true
sim-time-limit=20s
**.routingRecorder.enabled = true

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false


############### Transmission Power ##################
**.ueTxPower = 20
**.eNodeBTxPower = 40
**.targetBler = 0
**.blerShift = 0 

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 400  # reports CQI every 40ms

############### IPv4 configurator config #################


#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simu5g.simulations.Simulations.Test
sim-time-limit=20s

############### e/gNodeB configuration #################
 
*.gnb*.mobility.typename = "SuperpositioningMobility"
*.gnb*.mobility.numElements = 1
*.gnb*.mobility.element[0].typename = "RandomWaypointMobility"
*.gnb*.mobility.element[0].speed = uniform(0mps,1mps)
*.gnb*.mobility.element[0].constraintAreaMinZ = 50m
*.gnb*.mobility.element[0].constraintAreaMaxZ = 50m
*.gnb*.mobility.element[0].initialZ = 50m

*.gnb0.mobility.element[0].initialX = 300m
*.gnb0.mobility.element[0].initialY = 300m
*.gnb0.mobility.element[0].constraintAreaMinX = 275m
*.gnb0.mobility.element[0].constraintAreaMaxX = 325m
*.gnb0.mobility.element[0].constraintAreaMinY = 275m
*.gnb0.mobility.element[0].constraintAreaMaxY = 325m

*.gnb1.mobility.element[0].initialX = 300m
*.gnb1.mobility.element[0].initialY = 400m
*.gnb1.mobility.element[0].constraintAreaMinX = 275m
*.gnb1.mobility.element[0].constraintAreaMaxX = 325m
*.gnb1.mobility.element[0].constraintAreaMinY = 375m
*.gnb1.mobility.element[0].constraintAreaMaxY = 425m

*.gnb2.mobility.element[0].initialX = 200m
*.gnb2.mobility.element[0].initialY = 200m
*.gnb2.mobility.element[0].constraintAreaMinX = 175m
*.gnb2.mobility.element[0].constraintAreaMaxX = 225m
*.gnb2.mobility.element[0].constraintAreaMinY = 175m
*.gnb2.mobility.element[0].constraintAreaMaxY = 225m

*.gnb3.mobility.element[0].initialX = 200m
*.gnb3.mobility.element[0].initialY = 300m
*.gnb3.mobility.element[0].constraintAreaMinX = 175m
*.gnb3.mobility.element[0].constraintAreaMaxX = 225m
*.gnb3.mobility.element[0].constraintAreaMinY = 275m
*.gnb3.mobility.element[0].constraintAreaMaxY = 325m

*.gnb4.mobility.element[0].initialX = 200m
*.gnb4.mobility.element[0].initialY = 400m
*.gnb4.mobility.element[0].constraintAreaMinX = 175m
*.gnb4.mobility.element[0].constraintAreaMaxX = 225m
*.gnb4.mobility.element[0].constraintAreaMinY = 375m
*.gnb4.mobility.element[0].constraintAreaMaxY = 425m

############### ground station configuration #################
*.gat.mobility.typename = "StationaryMobility"
*.gat.mobility.initialX = uniform(300m,300m)
*.gat.mobility.initialY = uniform(200m,200m)
*.gat.mobility.initialZ = 0m

############### WiFi hosts configuration #################
**.adh[*].mobility.typename = "AttachedMobility"
**.adh[0].mobility.mobilityModule = "^.^.gnb0.mobility"
**.adh[1].mobility.mobilityModule = "^.^.gnb1.mobility"
**.adh[2].mobility.mobilityModule = "^.^.gnb2.mobility"
**.adh[3].mobility.mobilityModule = "^.^.gnb3.mobility"
**.adh[4].mobility.mobilityModule = "^.^.gnb4.mobility"

**.adh[*].mobility.offsetX = 1m
**.adh[*].mobility.offsetY = 1m
**.adh[*].mobility.offsetZ = 1m

############### WiFi hosts configuration #################
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.initialX = uniform(150m,350m)
*.ue[*].mobility.initialY = uniform(150m,550m)
*.ue[*].mobility.initialZ = 0m
*.ue[*].mobility.speed = uniform(0mps,1mps)

############### WiFi hosts configuration #################

**.adh[*].wlan[0].radio.transmitter.power = 5mW
**.gat.wlan[0].radio.transmitter.power = 5mW

**.adh[*].wlan[*].opMode = "g(erp)"
**.adh[*].wlan[*].bitrate = 54Mbps
**.gat.wlan[*].opMode = "g(erp)"
**.gat.wlan[*].bitrate = 54Mbps

############### CA configuration #################
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].numerologyIndex = ${u=0}
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = ${numRbs=50}

############### Number of Resource Blocks ################
#**.numBands = 50 # this value should be kept equal to the number of RBs

**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
**.ue[*].cellularNic.numCarriers = 1
**.ue[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0

############## UE configuration ##################
**.numUe = ${numUEs=25}

# connect the UE's NIC to the corresponding serving eNB
**.ue[*].macCellId = 0
**.ue[*].masterId = 0
**.ue[*].nrMacCellId = 2
**.ue[*].nrMasterId = 2

**.configurator.addStaticRoutes = false
# *.configurator.addDefaultRoute  = true
 
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
 
# routing protocol parameters
**.adh[*].routing.typename = "Ant"
**.adh[*].routing.helloInterval = 2s
**.adh[*].routing.routeLifetime = 5s
**.adh[*].routing.update_pheromone_Interval = 2s
**.adh[*].routing.update_throughput_Interval = 1s

**.gat.routing.typename = "Ant"
**.gat.routing.helloInterval = 2s
**.gat.routing.routeLifetime = 5s
**.gat.routing.update_pheromone_Interval = 2s
**.gat.routing.update_throughput_Interval = 1s


