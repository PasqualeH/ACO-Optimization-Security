**.gnb4.x2App[2].client.connectAddress = "gnb2%x2ppp0"
**.gnb4.x2App[3].client.connectAddress = "gnb3%x2ppp0"

# visualizer
*.visualizer.energyStorageVisualizer.displayEnergyStorages = true

# status for power
**.adh[*].hasStatus = true
**.gat.hasStatus = true

# power
**.adh[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.adh[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.adh[*].energyManagement.typename = "SimpleEpEnergyManagement"
**.adh[*].energyStorage.nominalCapacity = 0.5J
**.adh[*].energyManagement.nodeShutdownCapacity = 0.05 * parent.energyStorage.nominalCapacity
**.adh[*].energyManagement.nodeStartCapacity = 0.5 * parent.energyStorage.nominalCapacity
#**.adh[*].energyStorage.initialCapacity = uniform(0.1 * nominalCapacity, nominalCapacity)
**.adh[*].energyStorage.initialCapacity = 1.0 * parent.energyStorage.nominalCapacity

**.gat.energyStorage.typename = "SimpleEpEnergyStorage"
**.gat.wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.gat.energyManagement.typename = "SimpleEpEnergyManagement"
**.gat.energyStorage.nominalCapacity = 0.5J
**.gat.energyManagement.nodeShutdownCapacity = 0.05 * parent.energyStorage.nominalCapacity
**.gat.energyManagement.nodeStartCapacity = 0.5 * parent.energyStorage.nominalCapacity
**.gat.energyStorage.initialCapacity = 1.0 * parent.energyStorage.nominalCapacity


