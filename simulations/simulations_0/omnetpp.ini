[General]
image-path=../../../images
output-scalar-file-append = true
sim-time-limit=20s
**.routingRecorder.enabled = true
############### Ini config ##################
**.configurator.config = xmldoc("./configuration.xml")

############### Parameters ##################
**.numUe = ${numUEs=5}
#**.numUe = ${numUEs= 10, 10, 10, 10}
**.numS = numUe
**.numBgCells = 0
**.numgNb = ${numgnb=3}
############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${numgnb}.sca
output-vector-file = ${resultdir}/${configname}/${numgnb}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false

############### Transmission Power ##################
**.ueTxPower = 0.1
**.eNodeBTxPower = 0.1
**.targetBler = 0.01
**.blerShift = 0

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 4000  # reports CQI every 40ms

############### IPv4 configurator config #################

#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simulations.simulations_0.sim0
sim-time-limit=20s

############### e/gNodeB configuration #################

*.gnb*.mobility.typename = "StationaryMobility"
*.gnb*.mobility.initialZ = uniform(40m,60m)

*.gnb0.mobility.initialX = 200m
*.gnb0.mobility.initialY = 200m

*.gnb1.mobility.initialX = 300m
*.gnb1.mobility.initialY = 300m

*.gnb2.mobility.initialX = 200m
*.gnb2.mobility.initialY = 400m


############### ground station configuration #################
*.gat.mobility.typename = "StationaryMobility"
*.gat.mobility.initialX = uniform(300m,300m)
*.gat.mobility.initialY = uniform(200m,200m)
*.gat.mobility.initialZ = 50m

############### WiFi hosts configuration #################
**.adh[*].mobility.typename = "AttachedMobility"
**.adh[0].mobility.mobilityModule = "^.^.gnb0.mobility"
**.adh[1].mobility.mobilityModule = "^.^.gnb1.mobility"
**.adh[2].mobility.mobilityModule = "^.^.gnb2.mobility"

**.adh[*].mobility.offsetX = 1m
**.adh[*].mobility.offsetY = 1m
**.adh[*].mobility.offsetZ = 1m

############### WiFi hosts configuration #################
*.ue1[*].mobility.typename = "StationaryMobility"
*.ue1[*].mobility.initialX = uniform(150m,350m)
*.ue1[*].mobility.initialY = uniform(150m,550m)
*.ue1[*].mobility.initialZ = 0m

*.ue2[*].mobility.typename = "StationaryMobility"
*.ue2[*].mobility.initialX = uniform(150m,350m)
*.ue2[*].mobility.initialY = uniform(150m,550m)
*.ue2[*].mobility.initialZ = 0m

############### WiFi hosts configuration #################

**.adh[*].wlan[0].radio.transmitter.power = 2mW
**.gat.wlan[0].radio.transmitter.power = 2mW

**.adh[*].wlan[*].opMode = "g(mixed)"
#${bitrate = 6,9,12,18,24,36,48,54}Mbps
**.adh[*].wlan[*].bitrate =54Mbps
**.gat.wlan[*].opMode = "g(mixed)"
#${bitrate = 2,11}Mbps
**.gat.wlan[*].bitrate = 54Mbps


############### CA configuration #################
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].numerologyIndex = ${u=0}
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = ${numRbs=10}

############### Number of Resource Blocks ################
#**.numBands = 50 # this value should be kept equal to the number of RBs

**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
**.ue1[*].cellularNic.numCarriers = 1
**.ue1[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
**.ue2[*].cellularNic.numCarriers = 1
**.ue2[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
############## UE configuration ##################

# connect the UE's NIC to the corresponding serving eNB
**.ue1[*].macCellId = 0
**.ue1[*].masterId = 0
**.ue1[*].nrMacCellId = 1
**.ue1[*].nrMasterId = 1

**.ue2[*].macCellId = 0
**.ue2[*].masterId = 0
**.ue2[*].nrMacCellId = 1
**.ue2[*].nrMasterId = 1

**.configurator.addStaticRoutes = false
**.configurator.addDefaultRoute  = false
**.configurator.optimizeRoutes = false

**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
 
# routing protocol parameters
**.adh[*].routing.typename = "Ant"
**.adh[*].routing.helloInterval = 20s
**.adh[*].routing.routeLifetime = 40s
**.adh[*].routing.update_pheromone_Interval = 20s
**.adh[*].routing.update_throughput_Interval = 4s

**.gat.routing.typename = "Ant"
**.gat.routing.helloInterval = 20s
**.gat.routing.routeLifetime = 40s
**.gat.routing.update_pheromone_Interval = 20s
**.gat.routing.update_throughput_Interval = 4s

# IP configurator, routing

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false
**.dynamicCellAssociation = true
**.enableHandover = true
#------------------------------------#

############### X2 configuration #################
**.gnb0.numX2Apps = 2 #9                                        # one x2App per peering node
**.gnb1.numX2Apps = 1 #9
**.gnb2.numX2Apps = 1 #9

**.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
**.gnb0.x2App[0].client.connectAddress = "gnb1%x2ppp0"
**.gnb0.x2App[1].client.connectAddress = "gnb2%x2ppp0"

**.gnb1.x2App[0].client.connectAddress = "gnb0%x2ppp0"
**.gnb2.x2App[0].client.connectAddress = "gnb0%x2ppp0"


# visualizer
*.visualizer.energyStorageVisualizer.displayEnergyStorages = true

# status for power
**.adh[*].hasStatus = true
**.gat.hasStatus = true

# power
**.adh[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.adh[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.adh[*].energyManagement.typename = "SimpleEpEnergyManagement"
**.adh[*].energyStorage.nominalCapacity = 50J
**.adh[*].energyManagement.nodeShutdownCapacity = 0.05 * parent.energyStorage.nominalCapacity
**.adh[*].energyManagement.nodeStartCapacity = 0.5 * parent.energyStorage.nominalCapacity
#**.adh[*].energyStorage.initialCapacity = uniform(0.1 * nominalCapacity, nominalCapacity)
**.adh[*].energyStorage.initialCapacity = 1.0 * parent.energyStorage.nominalCapacity

**.gat.energyStorage.typename = "SimpleEpEnergyStorage"
**.gat.wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.gat.energyManagement.typename = "SimpleEpEnergyManagement"
**.gat.energyStorage.nominalCapacity = 50J
**.gat.energyManagement.nodeShutdownCapacity = 0.05 * parent.energyStorage.nominalCapacity
**.gat.energyManagement.nodeStartCapacity = 0.5 * parent.energyStorage.nominalCapacity
**.gat.energyStorage.initialCapacity = 1.0 * parent.energyStorage.nominalCapacity

#============= Application Setup =============
*.server1[*].numApps = 1
*.server2[*].numApps = 1
*.ue1[*].numApps = 1
*.ue2[*].numApps = 1

*.server1[*].app[*].typename = "SimpleVoipReceiver"
*.server1[*].app[*].playoutDelay = 20ms
*.server1[*].app[*].mosSpareTime = 100ms
*.server1[*].app[*].localPort = 3000

*.server2[*].app[*].typename = "UdpSink"
*.server2[*].app[*].localPort = 5000

*.ue1[*].app[0].typename = "SimpleVoipSender"
*.ue1[*].app[0].talkPacketSize = 40B
*.ue1[*].app[0].packetizationInterval = exponential(20ms)
*.ue1[*].app[0].localPort = 4000+ancestorIndex(0)
*.ue1[*].app[0].destPort = 3000
*.ue1[*].app[0].stopTime = 20s
*.ue1[*].app[0].startTime = uniform(5s,10s)


*.ue2[*].app[0].typename = "UdpBasicApp"
*.ue2[*].app[0].messageLength = 40byte
*.ue2[*].app[0].sendInterval = exponential(20ms)
*.ue2[*].app[0].destPort = 5000
*.ue2[*].app[0].startTime = uniform(5s,10s)
*.ue2[*].app[0].stopTime = 20s

