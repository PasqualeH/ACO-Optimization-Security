[General]
image-path=../../../images
output-scalar-file-append = true
sim-time-limit=60s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false


############### Transmission Power ##################
**.ueTxPower = 0.1
**.eNodeBTxPower = 0.1
**.targetBler = 0.01
**.blerShift = 0

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 400  # reports CQI every 40ms

############### IPv4 configurator config #################


#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simulations.simulations3.Test3
sim-time-limit=60s

############### e/gNodeB configuration #################

*.gnb*.mobility.typename = "StationaryMobility"
*.gnb*.mobility.initialZ = 50m

*.gnb0.mobility.initialX = 300m
*.gnb0.mobility.initialY = 300m


*.gnb1.mobility.initialX = 300m
*.gnb1.mobility.initialY = 400m


*.gnb2.mobility.initialX = 200m
*.gnb2.mobility.initialY = 200m


*.gnb3.mobility.initialX = 200m
*.gnb3.mobility.initialY = 300m


*.gnb4.mobility.initialX = 200m
*.gnb4.mobility.initialY = 400m


*.gnb5.mobility.initialX = 250m
*.gnb5.mobility.initialY = 250m

*.gnb6.mobility.initialX = 250m
*.gnb6.mobility.initialY = 350m

*.gnb7.mobility.initialX = 250m
*.gnb7.mobility.initialY = 150m

*.gnb8.mobility.initialX = 250m
*.gnb8.mobility.initialY = 450m

############### ground station configuration #################
*.gat.mobility.typename = "StationaryMobility"
*.gat.mobility.initialX = uniform(300m,300m)
*.gat.mobility.initialY = uniform(200m,200m)
*.gat.mobility.initialZ = 0m

############### WiFi hosts configuration #################
**.adh[*].mobility.typename = "AttachedMobility"
**.adh[0].mobility.mobilityModule = "^.^.gnb0.mobility"
**.adh[1].mobility.mobilityModule = "^.^.gnb1.mobility"
**.adh[2].mobility.mobilityModule = "^.^.gnb2.mobility"
**.adh[3].mobility.mobilityModule = "^.^.gnb3.mobility"
**.adh[4].mobility.mobilityModule = "^.^.gnb4.mobility"
**.adh[5].mobility.mobilityModule = "^.^.gnb5.mobility"
**.adh[6].mobility.mobilityModule = "^.^.gnb6.mobility"
**.adh[7].mobility.mobilityModule = "^.^.gnb7.mobility"
**.adh[8].mobility.mobilityModule = "^.^.gnb8.mobility"

**.adh[*].mobility.offsetX = 1m
**.adh[*].mobility.offsetY = 1m
**.adh[*].mobility.offsetZ = 1m

############### WiFi hosts configuration #################
*.ue1[*].mobility.typename = "StationaryMobility"
*.ue1[*].mobility.initialX = uniform(150m,350m)
*.ue1[*].mobility.initialY = uniform(150m,550m)
*.ue1[*].mobility.initialZ = 0m

*.ue2[*].mobility.typename = "StationaryMobility"
*.ue2[*].mobility.initialX = uniform(150m,350m)
*.ue2[*].mobility.initialY = uniform(150m,550m)
*.ue2[*].mobility.initialZ = 0m

############### WiFi hosts configuration #################

**.adh[*].wlan[0].radio.transmitter.power = 2mW
**.gat.wlan[0].radio.transmitter.power = 2mW

**.adh[*].wlan[*].opMode = "b"
#${bitrate = 6,9,12,18,24,36,48,54}Mbps
**.adh[*].wlan[*].bitrate = 2Mbps
**.gat.wlan[*].opMode = "b"
#${bitrate = 2,11}Mbps
**.gat.wlan[*].bitrate = 11Mbps


############### WiFi AC #################
#**.bandName = "5 GHz (160 MHz)" #,"5 GHz (20 MHz)","5 GHz (40 MHz)","5 GHz (80 MHz)","5 GHz (160 MHz)"
#**.opMode = "ac"

#**.wlan[*].radio.antenna.numAntennas = 8 #maximum number of streams for 802.11ac is 8

#**.bitrate = 693.3Mbps

#**.wlan[*].radio.transmitter.power = 5mW
#**.wlan[*].radio.transmitter.headerBitLength = 96b
#**.centerFrequency = 5GHz
#**.wlan[*].radio.receiver.sensitivity = -85dBm
#**.wlan[*].radio.receiver.snirThreshold = 4dB


############### CA configuration #################
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].numerologyIndex = ${u=0}
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = ${numRbs=1}

############### Number of Resource Blocks ################
#**.numBands = 50 # this value should be kept equal to the number of RBs

**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
**.ue1[*].cellularNic.numCarriers = 1
**.ue1[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
**.ue2[*].cellularNic.numCarriers = 1
**.ue2[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
############## UE configuration ##################
**.numUe = ${numUEs=5}

# connect the UE's NIC to the corresponding serving eNB
**.ue1[*].macCellId = 0
**.ue1[*].masterId = 0
**.ue1[*].nrMacCellId = 1
**.ue1[*].nrMasterId = 1

**.ue2[*].macCellId = 0
**.ue2[*].masterId = 0
**.ue2[*].nrMacCellId = 1
**.ue2[*].nrMasterId = 1

**.configurator.addStaticRoutes = false
# *.configurator.addDefaultRoute  = true
 
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
 
# routing protocol parameters
**.adh[*].routing.typename = "Ant"
**.adh[*].routing.helloInterval = 20s
**.adh[*].routing.routeLifetime = 40s
**.adh[*].routing.update_pheromone_Interval = 20s
**.adh[*].routing.update_throughput_Interval = 4s

**.gat.routing.typename = "Ant"
**.gat.routing.helloInterval = 20s
**.gat.routing.routeLifetime = 40s
**.gat.routing.update_pheromone_Interval = 20s
**.gat.routing.update_throughput_Interval = 4s


