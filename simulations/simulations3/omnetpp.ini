#*.ue[*].app[0].talkspurtDuration = weibull(1.423s, 0.824s)
#*.ue[*].app[0].silenceDuration = weibull(0.899s, 1.089s)

*.ue2[*].app[0].typename = "UdpBasicApp"
*.ue2[*].app[0].messageLength = 40byte
*.ue2[*].app[0].sendInterval = exponential(20ms)
#*.ue[*].app[1].destAddresses = "server2"
*.ue2[*].app[0].destPort = 5000
*.ue2[*].app[0].startTime = uniform(5s,30s)
*.ue2[*].app[0].stopTime = 60s

