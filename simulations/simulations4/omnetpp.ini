[General]
network = simulations.simulations4.Test4
output-scalar-file-append = true
sim-time-limit=60s
**.routingRecorder.enabled = true

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false

*.node[*].mobility.typename = "StationaryMobility"
*.node[*].mobility.initialZ = 50m

*.node[0].mobility.initialX = 300m
*.node[0].mobility.initialY = 300m
*.node[1].mobility.initialX = 300m
*.node[1].mobility.initialY = 400m
*.node[2].mobility.initialX = 200m
*.node[2].mobility.initialY = 200m
*.node[3].mobility.initialX = 200m
*.node[3].mobility.initialY = 300m
*.node[4].mobility.initialX = 200m
*.node[4].mobility.initialY = 400m


############### WiFi hosts configuration #################
**.adh[*].mobility.typename = "AttachedMobility"
**.router[*].mobility.typename = "AttachedMobility"

**.adh[0].mobility.mobilityModule = "^.^.node[0].mobility"
**.adh[1].mobility.mobilityModule = "^.^.node[1].mobility"
**.adh[2].mobility.mobilityModule = "^.^.node[2].mobility"
**.adh[3].mobility.mobilityModule = "^.^.node[3].mobility"
**.adh[4].mobility.mobilityModule = "^.^.node[4].mobility"

**.router[0].mobility.mobilityModule = "^.^.node[0].mobility"
**.router[1].mobility.mobilityModule = "^.^.node[1].mobility"
**.router[2].mobility.mobilityModule = "^.^.node[2].mobility"
**.router[3].mobility.mobilityModule = "^.^.node[3].mobility"
**.router[4].mobility.mobilityModule = "^.^.node[4].mobility"

**.adh[*].mobility.offsetX = 2m
**.adh[*].mobility.offsetY = 2m
**.adh[*].mobility.offsetZ = 2m

**.router[*].mobility.offsetX = 1m
**.router[*].mobility.offsetY = 1m
**.router[*].mobility.offsetZ = 1m

############### WiFi hosts configuration #################
*.ue1[*].mobility.typename = "StationaryMobility"
*.ue1[*].mobility.initialX = uniform(100m,300m)
*.ue1[*].mobility.initialY = uniform(100m,500m)
*.ue1[*].mobility.initialZ = 0m

*.ue2[*].mobility.typename = "StationaryMobility"
*.ue2[*].mobility.initialX = uniform(100m,100m)
*.ue2[*].mobility.initialY = uniform(100m,200m)
*.ue2[*].mobility.initialZ = 0m

**.configurator.addDefaultRoutes = false
**.configurator.addStaticRoutes = false
**.netmaskRoutes = ""
#**.arp.typename = "GlobalArp"
# management submodule parameters
**.mgmt.numChannels = 5

# access point
**.node[0].wlan[*].mgmt.ssid = "AP0"
**.node[1].wlan[*].mgmt.ssid = "AP1"
**.node[2].wlan[*].mgmt.ssid = "AP2"
**.node[3].wlan[*].mgmt.ssid = "AP3"
**.node[4].wlan[*].mgmt.ssid = "AP4"
**.node[*].wlan[*].mgmt.beaconInterval = 1000ms


# wireless channels
**.analogModel.ignorePartialInterference = true
**.node[0].wlan[*].radio.channelNumber = 1
**.node[1].wlan[*].radio.channelNumber = 2
**.node[2].wlan[*].radio.channelNumber = 3
**.node[3].wlan[*].radio.channelNumber = 4
**.node[4].wlan[*].radio.channelNumber = 5
**.ue1[*].wlan[*].radio.channelNumber = 0  # just initially -- it'll scan
**.ue2[*].wlan[*].radio.channelNumber = 0  # just initially -- it'll scan

# wireless configuration
**.node[*].wlan[0].radio.transmitter.power = 0.5mW
**.adh[*].wlan[0].radio.transmitter.power =0.5mW
**.ue1[*].wlan[0].radio.transmitter.power = 0.5mW
**.ue2[*].wlan[0].radio.transmitter.power = 0.5mW

#**.networkConfiguratorModule = ""  # no need for configurator

**.wlan[*].agent.activeScan = true
**.wlan[*].agent.defaultSsid = ""
**.wlan[*].agent.channelsToScan = ""  # "" means all
**.wlan[*].agent.probeDelay = 0.1s
**.wlan[*].agent.minChannelTime = 0.15s
**.wlan[*].agent.maxChannelTime = 0.3s

# visualization
*.visualizer.physicalLinkVisualizer.displayLinks = false
*.node[*].wlan[*].radio.displayCommunicationRange = true


*.ue1[*].numApps = 1
*.ue2[*].numApps = 1

*.ue2[*].app[0].typename = "PingApp"
*.ue1[*].app[0].typename = "PingApp"
*.ue2[*].app[0].destAddr = "ue1[0]"
*.ue1[*].app[0].destAddr = "ue2[0]"
*.ue1[*].app[0].stopTime = 360s
*.ue1[*].app[0].startTime = 5s
*.ue2[*].app[0].startTime = 5s
*.ue1[*].app[*].sendInterval = 100ms
*.ue2[*].app[*].sendInterval = 100ms


**.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.x' /> \
<route hosts='ue1[*]' destination='0.0.0.0' netmask='0.0.0.0' gateway='*' interface='wlan0' metric='0'/> \
<route hosts='ue2[*]' destination='0.0.0.0' netmask='0.0.0.0' gateway='*' interface='wlan0' metric='0'/> \
<route hosts='router[*]' destination='0.0.0.0' netmask='0.0.0.0' gateway='*' interface='ppp0' metric='0'/> \
</config>")

# routing protocol parameters
**.adh[*].routing.typename = "Ant"
**.adh[*].routing.helloInterval = 5s
**.adh[*].routing.routeLifetime = 10s
**.adh[*].routing.update_pheromone_Interval = 10s
**.adh[*].routing.update_throughput_Interval = 5s

# status for power
**.adh[*].hasStatus = true

# power
**.adh[*].energyStorage.typename = "SimpleEpEnergyStorage"
**.adh[*].wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.adh[*].energyManagement.typename = "SimpleEpEnergyManagement"
**.adh[*].energyStorage.nominalCapacity = 50J
**.adh[*].energyManagement.nodeShutdownCapacity = 0.05 * parent.energyStorage.nominalCapacity
**.adh[*].energyManagement.nodeStartCapacity = 0.5 * parent.energyStorage.nominalCapacity
#**.adh[*].energyStorage.initialCapacity = uniform(0.1 * nominalCapacity, nominalCapacity)
**.adh[*].energyStorage.initialCapacity = 1.0 * parent.energyStorage.nominalCapacity
