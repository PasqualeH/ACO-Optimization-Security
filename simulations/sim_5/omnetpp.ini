**.gnb0.x2App[9].client.connectAddress = "gnb10%x2ppp0"
**.gnb0.x2App[10].client.connectAddress = "gnb11%x2ppp0"

**.gnb1.x2App[0].client.connectAddress = "gnb0%x2ppp0"
**.gnb2.x2App[0].client.connectAddress = "gnb0%x2ppp0"
**.gnb3.x2App[0].client.connectAddress = "gnb0%x2ppp0"
**.gnb4.x2App[0].client.connectAddress = "gnb0%x2ppp0"
**.gnb5.x2App[0].client.connectAddress = "gnb0%x2ppp0"
