[General]
image-path=../../../images
output-scalar-file-append = true
sim-time-limit=7s
**.routingRecorder.enabled = true

seed-set = ${runnumber}
num-rngs = 2000
repeat = 10
############### Ini config ##################
**.configurator.config = xmldoc("./configuration_${numUEs}.xml")

############### Parameters ##################
#**.numUe = ${numUEs=15}
**.numUe = ${numUEs= 5,10,15,20,25,30,35,40,45,50}
**.numS = numUe
**.numBgCells = 0
**.numgNb = ${numgnb=12}


############### Statistics ##################
#output-scalar-file = ${resultdir}/${configname}/${numgnb}_${numUEs}.sca
#output-vector-file = ${resultdir}/${configname}/${numgnb}_${numUEs}.vec
#seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false

############### Transmission Power ##################
**.ueTxPower = 10
**.eNodeBTxPower = 10
**.targetBler = 0.01
**.blerShift = 5

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 1000  # reports CQI every 40ms

############### IPv4 configurator config #################

#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
network = simulations.sim_5.sim5

############### e/gNodeB configuration #################

*.adh[*].mobility.typename = "LinearMobility"
*.adh[*].mobility.initFromDisplayString = false
*.adh[*].mobility.speed = 0mps
*.adh[*].mobility.angle = 30deg  # degrees
*.adh[*].mobility.initialZ = uniform(50m,50m)

*.adh[0].mobility.initialX = 300m
*.adh[0].mobility.initialY = 500m

*.adh[1].mobility.initialX = 150m
*.adh[1].mobility.initialY = 350m

*.adh[2].mobility.initialX = 450m
*.adh[2].mobility.initialY = 350m

*.adh[3].mobility.initialX = 150m
*.adh[3].mobility.initialY = 650m

*.adh[4].mobility.initialX = 450m
*.adh[4].mobility.initialY = 650m

*.adh[5].mobility.initialX = 300m
*.adh[5].mobility.initialY = 300m

*.adh[6].mobility.initialX = 300m
*.adh[6].mobility.initialY = 700m

*.adh[7].mobility.initialX = 100m
*.adh[7].mobility.initialY = 500m

*.adh[8].mobility.initialX = 500m
*.adh[8].mobility.initialY = 500m

*.adh[9].mobility.initialX = 300m
*.adh[9].mobility.initialY = 400m

*.adh[10].mobility.initialX = 300m
*.adh[10].mobility.initialY = 600m

*.adh[11].mobility.initialX = 400m
*.adh[11].mobility.initialY = 500m


############### ground station configuration #################
*.gat.mobility.typename = "LinearMobility"
*.gat.mobility.initFromDisplayString = false
*.gat.mobility.speed = 0mps
*.gat.mobility.angle = 0deg  # degrees
*.gat.mobility.initialX = uniform(300m,300m)
*.gat.mobility.initialY = uniform(500m,500m)
*.gat.mobility.initialZ = 70m

############### WiFi hosts configuration #################

**.gnb*.mobility.typename = "AttachedMobility"
**.gnb0.mobility.mobilityModule = "^.^.adh[0].mobility"
**.gnb1.mobility.mobilityModule = "^.^.adh[1].mobility"
**.gnb2.mobility.mobilityModule = "^.^.adh[2].mobility"
**.gnb3.mobility.mobilityModule = "^.^.adh[3].mobility"
**.gnb4.mobility.mobilityModule = "^.^.adh[4].mobility"
**.gnb5.mobility.mobilityModule = "^.^.adh[5].mobility"
**.gnb6.mobility.mobilityModule = "^.^.adh[6].mobility"
**.gnb7.mobility.mobilityModule = "^.^.adh[7].mobility"
**.gnb8.mobility.mobilityModule = "^.^.adh[8].mobility"
**.gnb9.mobility.mobilityModule = "^.^.adh[9].mobility"
**.gnb10.mobility.mobilityModule = "^.^.adh[10].mobility"
**.gnb11.mobility.mobilityModule = "^.^.adh[11].mobility"

**.adh[*].mobility.offsetX = -1m
**.adh[*].mobility.offsetY = -1m
**.adh[*].mobility.offsetZ = -1m

############### WiFi hosts configuration #################
*.ue1[*].mobility.typename = "StationaryMobility"
*.ue1[*].mobility.initialX = uniform(50m,550m)
*.ue1[*].mobility.initialY = uniform(250m,750m)
*.ue1[*].mobility.initialZ = 0m

*.ue2[*].mobility.typename = "StationaryMobility"
*.ue2[*].mobility.initialX = uniform(50m,550m)
*.ue2[*].mobility.initialY = uniform(250m,750m)
*.ue2[*].mobility.initialZ = 0m

############### WiFi hosts configuration #################
**.adh[*].wlan[*].radio.transmitter.power = 10mW
**.gat.wlan[*].radio.transmitter.power = 10mW

**.adh[*].wlan[*].opMode = "g(mixed)"
#${bitrate = 6,9,12,18,24,36,48,54}Mbps
**.adh[*].wlan[*].bitrate = 54Mbps
**.gat.wlan[*].opMode = "g(mixed)"
#${bitrate = 2,11}Mbps
**.gat.wlan[*].bitrate = 54Mbps

############### CA configuration #################
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].numerologyIndex = 0
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = 20

############### Number of Resource Blocks ################
#**.numBands = 50 # this value should be kept equal to the number of RBs

**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
**.ue1[*].cellularNic.numCarriers = 1
**.ue1[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
**.ue2[*].cellularNic.numCarriers = 1
**.ue2[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0
############## UE configuration ##################

# connect the UE's NIC to the corresponding serving eNB
**.ue1[*].macCellId = 0
**.ue1[*].masterId = 0
**.ue1[*].nrMacCellId = 1
**.ue1[*].nrMasterId = 1

**.ue2[*].macCellId = 0
**.ue2[*].masterId = 0
**.ue2[*].nrMacCellId = 1
**.ue2[*].nrMasterId = 1

**.configurator.addStaticRoutes = false
**.configurator.addDefaultRoute  = false
**.configurator.optimizeRoutes = false

**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
 
# routing protocol parameters
**.adh[*].routing.typename = "Ant"
**.adh[*].routing.helloInterval = 20s
**.adh[*].routing.routeLifetime = 40s
**.adh[*].routing.update_pheromone_Interval = 20s
**.adh[*].routing.update_throughput_Interval = 4s

**.gat.routing.typename = "Ant"
**.gat.routing.helloInterval = 20s
**.gat.routing.routeLifetime = 40s
**.gat.routing.update_pheromone_Interval = 20s
**.gat.routing.update_throughput_Interval = 4s

# IP configurator, routing

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false
**.dynamicCellAssociation = true
**.enableHandover = true
#------------------------------------#

############### X2 configuration #################
**.gnb0.numX2Apps = 11 #9                                        # one x2App per peering node
**.gnb1.numX2Apps = 1 #9
**.gnb2.numX2Apps = 1 #9
**.gnb3.numX2Apps = 1 #9
**.gnb4.numX2Apps = 1 #9
**.gnb5.numX2Apps = 1 #9
**.gnb6.numX2Apps = 1 #9
**.gnb7.numX2Apps = 1 #9
**.gnb8.numX2Apps = 1 #9
**.gnb9.numX2Apps = 1 #9
**.gnb10.numX2Apps = 1 #9
**.gnb11.numX2Apps = 1 #9

**.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
**.gnb0.x2App[0].client.connectAddress = "gnb1%x2ppp0"
**.gnb0.x2App[1].client.connectAddress = "gnb2%x2ppp0"
**.gnb0.x2App[2].client.connectAddress = "gnb3%x2ppp0"
