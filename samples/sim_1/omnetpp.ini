[General]
image-path=../../../images
output-scalar-file-append = true
sim-time-limit=60s
**.routingRecorder.enabled = false

seed-set = ${runnumber}
num-rngs = 20000
#repeat = 3
############### Ini config ##################
#**.configurator.config = xmldoc("./configuration_${numUEs}_5.xml")
**.configurator.config = xmldoc("./configuration_10_3.xml")
result-dir = 5/

############### Parameters ##################
**.numUe = 10
#**.numUe = ${numUEs= 5,10,15,20,25,30,35,40,45,50}
#**.numUe = ${numUEs= 50}
**.numS = numUe
**.numBgCells = 0
**.numgNb = ${numgnb=15}

############### Statistics ##################
**.vector-recording = false
############# Mobility parameters ##########

**.mobility.constraintAreaMaxX = 2160m
**.mobility.constraintAreaMaxY = 1080m
**.mobility.constraintAreaMaxZ = 3000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false

############### Transmission Power ##################
**.ueTxPower = 10
**.eNodeBTxPower = 10
**.targetBler = 0.01
**.blerShift = 5

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 40  # reports CQI every 40ms

network = samples.sim_1.sim1

############### Manet routers mobility ###############

*.adh[*].mobility.typename = "LinearMobility"
*.adh[*].mobility.initFromDisplayString = false
*.adh[*].mobility.speed = 0mps
*.adh[*].mobility.angle = 30deg  # degrees
*.adh[*].mobility.initialZ = uniform(50m,50m)

*.adh[0].mobility.initialX = 300m
*.adh[0].mobility.initialY = 500m

*.adh[1].mobility.initialX = 150m
*.adh[1].mobility.initialY = 350m

*.adh[2].mobility.initialX = 450m
*.adh[2].mobility.initialY = 350m

*.adh[3].mobility.initialX = 150m
*.adh[3].mobility.initialY = 650m

*.adh[4].mobility.initialX = 450m
*.adh[4].mobility.initialY = 650m

*.adh[5].mobility.initialX = 700m
*.adh[5].mobility.initialY = 400m

*.adh[6].mobility.initialX = 800m
*.adh[6].mobility.initialY = 500m

*.adh[7].mobility.initialX = 900m
*.adh[7].mobility.initialY = 600m

*.adh[8].mobility.initialX = 1000m
*.adh[8].mobility.initialY = 300m

*.adh[9].mobility.initialX = 1100m
*.adh[9].mobility.initialY = 500m

*.adh[10].mobility.initialX = 1700m
*.adh[10].mobility.initialY = 400m

*.adh[11].mobility.initialX = 1800m
*.adh[11].mobility.initialY = 500m

*.adh[12].mobility.initialX = 1900m
*.adh[12].mobility.initialY = 300m

*.adh[13].mobility.initialX = 2000m
*.adh[13].mobility.initialY = 600m

*.adh[14].mobility.initialX = 2100m
*.adh[14].mobility.initialY = 400m

########## Ground Control Station mobility #######
*.gat*.mobility.typename = "LinearMobility"
*.gat*.mobility.initFromDisplayString = false
*.gat*.mobility.speed = 0mps
*.gat*.mobility.angle = 0deg  # degrees
*.gat*.mobility.initialZ = 70m

*.gat1.mobility.initialX = uniform(300m,300m)
*.gat1.mobility.initialY = uniform(500m,500m)

*.gat2.mobility.initialX = uniform(900m,900m)
*.gat2.mobility.initialY = uniform(500m,500m)

*.gat3.mobility.initialX = uniform(1900m,1900m)
*.gat3.mobility.initialY = uniform(500m,500m)

############ gnodeB mobility ###############

**.gnb*.mobility.typename = "AttachedMobility"
**.gnb0.mobility.mobilityModule = "^.^.adh[0].mobility"
**.gnb1.mobility.mobilityModule = "^.^.adh[1].mobility"
**.gnb2.mobility.mobilityModule = "^.^.adh[2].mobility"
