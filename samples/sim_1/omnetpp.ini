[General]
image-path=../../../images
output-scalar-file-append = false
sim-time-limit=120s
**.routingRecorder.enabled = false
**.routing.useCentralAuthority = true

seed-set = ${runnumber}
num-rngs = 20000
repeat = 3
############### Ini config ##################
**.configurator.config = xmldoc("./configuration_${numUEs}_5.xml")
#**.configurator.config = xmldoc("./configuration_10_3.xml")
result-dir = 5/

############### Parameters ##################
#**.numUe = 10
#**.numUe = ${numUEs= 5,10,15,20,25,30}
#**.numUe = ${numUEs= 5,10,15,20,25,30,35,40,45,50}
**.numUe = ${numUEs= 20}
#**.numUe = ${numUEs= 10,30}
**.numS = numUe
**.numBgCells = 0
**.numgNb = ${numgnb=15}

############### Statistics ##################
**.vector-recording = false
############# Mobility parameters ##########

**.mobility.constraintAreaMaxX = 2160m
**.mobility.constraintAreaMaxY = 1080m
**.mobility.constraintAreaMaxZ = 3000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.initFromDisplayString = false

############### Transmission Power ##################
**.ueTxPower = 10
**.eNodeBTxPower = 10
**.targetBler = 0.01
**.blerShift = 5

############### General PHY parameters ##############
**.downlink_interference = false
**.uplink_interference = false
**.fbPeriod = 40  # reports CQI every 40ms

network = samples.sim_1.sim1

############### Manet routers mobility ###############

