**.adh[*].mobility.offsetX = -1m
**.adh[*].mobility.offsetY = -1m
**.adh[*].mobility.offsetZ = -1m

############### Users mobility ##############
*.ue1[*].mobility.typename = "StationaryMobility"
*.ue1[*].mobility.initialX = uniform(50m,550m)
*.ue1[*].mobility.initialY = uniform(250m,750m)
*.ue1[*].mobility.initialZ = 0m

*.ue2[*].mobility.typename = "StationaryMobility"
*.ue2[*].mobility.initialX = uniform(50m,550m)
*.ue2[*].mobility.initialY = uniform(250m,750m)
*.ue2[*].mobility.initialZ = 0m

############### WiFi hosts configuration #############

**.adh[*].wlan[*].radio.transmitter.power = 3mW #2
**.gat*.wlan[0].radio.transmitter.power = 3mW
**.gat*.wlan[1].radio.transmitter.power = 20mW

**.gat*.numWlanInterfaces = 2

**.satellite[*].wlan[*].radio.transmitter.power = 10W #100
**.satellite[*].wlan[*].radio.receiver.snirThreshold = 0dB
**.satellite[*].wlan[*].radio.receiver.sensitivity = -200dBm #-200
**.satellite[*].wlan[*].radio.receiver.energyDetection = -100dBm # -100
**.satellite[*].wlan[*].radio.antenna.typename = "ConstantGainAntenna"
**.satellite[*].wlan[*].radio.antenna.gain = 34dB

**.adh[*].wlan[*].opMode = "g(erp)"
**.adh[*].wlan[*].bitrate = 54Mbps
**.gat*.wlan[0].opMode = "g(erp)"
**.gat*.wlan[0].bitrate = 54Mbps
**.gat*.wlan[1].opMode = "b"
**.gat*.wlan[1].bitrate = 11Mbps
**.satellite[*].wlan[*].opMode = "b"
**.satellite[*].wlan[*].bitrate = 11Mbps

############### CA configuration #################
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].numerologyIndex = 0
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = 20

############ Number of Resource Blocks ##########

**.gnb*.cellularNic.numCarriers = 1
**.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0
