[Config FastSecurityTest]
extends = General
sim-time-limit = 120s
**.routing.typename = "Ant2"
**.routing.useCentralAuthority = true
#**.adh[7].routing.isAttacker = true

# Impostiamo nodi e file XML per evitare conflitti
**.numUe = 10
**.configurator.config = xmldoc("./configuration_10_5.xml")

# 1. ANTICIPIAMO IL TRAFFICO: facciamo partire gli utenti a 5 secondi anziché a 15
*.ue1[*].app[0].startTime = 5s
*.ue2[*].app[0].startTime = 5s

# 2. ALLEGGERIAMO IL CARICO: per far durare la run pochi minuti
*.ue1[*].app[0].packetizationInterval = 100ms
*.ue2[*].app[0].sendInterval = 100ms
*.satellite[*].mobility.updateInterval = 2s

repeat = 1
**.vector-recording = false
**.scalar-recording = false
**.routingRecorder.enabled = false
cmdenv-redirect-output = true
cmdenv-output-file = log_sicurezza.txt

# =========================================================================
#  CAMPAGNA DI MISURE - confronto con e senza livello di sicurezza
# =========================================================================

[Config MisureConSicurezza]
extends = General
sim-time-limit = 120s
repeat = 3

**.routing.typename = "Ant2"
**.routing.securityEnabled = true
**.routing.useCentralAuthority = true
**.routing.aeadAlgorithm = "aes256gcm"
#**.adh[7].routing.attackFalseMetrics = true
#**.adh[7].routing.attackHopDistance = true

# Solo scalari: i vettori su decine di run darebbero file enormi.
**.vector-recording = false
**.scalar-recording = true
**.routingRecorder.enabled = false

[Config MisureSenzaSicurezza]
extends = MisureConSicurezza
**.routing.securityEnabled = false

[Config FirmaConfronto]
extends = General
sim-time-limit = 120s
repeat = 10
seed-set = ${repetition}          # stesso seme per i due bracci: confronto appaiato
result-dir = risultati_firma/
 
**.routing.typename = "Ant2"
**.routing.securityEnabled = true
**.routing.useCentralAuthority = true
**.routing.aeadAlgorithm = "ascon128"
**.routing.signatureAlgorithm = ${firma="ed25519","ecdsap256"}

 
**.vector-recording = false
**.scalar-recording = true
**.routingRecorder.enabled = false



# =========================================================================
#  PROFILI DI TRAFFICO DEGLI UTENTI  (basso / medio / saturo / misto)
# =========================================================================
#
# Due manopole in TrafficoCheck e TrafficoConSicurezza:
#   **.numUe = ${utenti=10,20,30,40,50}                      utenti per tipo
#   *.ue2[*].app[0].packetName = "..._${traffico=basso,...}"  livello di traffico
# OMNeT++ fa una run per ogni combinazione, ripetuta "repeat" volte.
#
#  livello  VoIP (ue1)                       dati (ue2)
#  basso     60 B / 60 ms  G.729 (8 kbit/s)   250 B / 1 s   telemetria
#  medio    100 B / 20 ms  ~40 kbit/s         100 B / 20 ms flusso continuo
#  saturo   160 B / 20 ms  G.711 (64 kbit/s)  1000 B / 40 ms video
#  misto    a rotazione: indice 0,3,6..=basso  1,4,7..=medio  2,5,8..=saturo
#
# "medio" coincide col traffico di [General]: le campagne precedenti restano confrontabili.
#
# Carico atteso sul cluster 1 (2 Mbit/s), con ~64 B di intestazioni e VoIP al 64,5%:
#   utenti per tipo:  10     20     30     40     50
#   basso             7%    13%    20%    26%    33%
#   medio            54%   108%   162%   216%   270%
#   saturo          135%   271%   406%   541%   676%
#   misto            65%   131%   196%   261%   326%
#
# Vincoli di OMNeT++ 6.0.3 da non violare:
#  - non riusare il nome "numUEs": le variabili di iterazione si raccolgono da tutta
#    la catena di sezioni e si otterrebbe "Redefinition of iteration variable";
#  - una sezione che cambia gli elenchi non puo' estenderne una che li definisce;
#  - le righe che usano ${traffico} devono stare nella sezione che lo definisce,
#    per questo sono ripetute identiche nelle due sezioni.

# Base comune, non si lancia da sola.
# -------------------------------------------------------------------------
[Config TrafficoBase]
extends = General
sim-time-limit = 120s
# 3 ripetizioni per le prove; per la tesi portare a 30 (t di Student affidabile).
repeat = 1 #3
# Stesso seme per i due bracci con/senza sicurezza: confronto appaiato.
seed-set = ${repetition}
result-dir = risultati_traffico/

# Livello di sicurezza scelto nelle Fasi E/F. Nessun nodo attaccante.
**.routing.typename = "Ant2"
**.routing.securityEnabled = true
**.routing.useCentralAuthority = true
**.routing.aeadAlgorithm = "ascon128"
**.routing.signatureAlgorithm = "ed25519"

**.vector-recording = false
**.scalar-recording = true
**.routingRecorder.enabled = false

# Controllo di funzionamento: 10 utenti, quattro livelli, 1 ripetizione. Da lanciare per primo.
# -------------------------------------------------------------------------
[Config TrafficoCheck]
extends = TrafficoBase
repeat = 1

# --- manopole ---
**.numUe = ${utenti=10}
*.ue2[*].app[0].packetName = "UdpBasicAppData_${traffico=basso,medio,saturo,misto}"

# --- valori calcolati dal livello (identici in TrafficoConSicurezza) ---
#                                       basso                            medio                            saturo                           misto
*.ue1[*].app[0].talkPacketSize        = ("${traffico}" == "basso") ? 60B   : (("${traffico}" == "medio") ? 100B : (("${traffico}" == "saturo") ? 160B  : ((ancestorIndex(1) % 3 == 0) ? 60B   : ((ancestorIndex(1) % 3 == 1) ? 100B : 160B))))
*.ue1[*].app[0].packetizationInterval = ("${traffico}" == "basso") ? 60ms  : (("${traffico}" == "medio") ? 20ms : (("${traffico}" == "saturo") ? 20ms  : ((ancestorIndex(1) % 3 == 0) ? 60ms  : 20ms)))
*.ue2[*].app[0].messageLength         = ("${traffico}" == "basso") ? 250B  : (("${traffico}" == "medio") ? 100B : (("${traffico}" == "saturo") ? 1000B : ((ancestorIndex(1) % 3 == 0) ? 250B  : ((ancestorIndex(1) % 3 == 1) ? 100B : 1000B))))
*.ue2[*].app[0].sendInterval          = ("${traffico}" == "basso") ? 1s    : (("${traffico}" == "medio") ? 20ms : (("${traffico}" == "saturo") ? 40ms  : ((ancestorIndex(1) % 3 == 0) ? 1s    : ((ancestorIndex(1) % 3 == 1) ? 20ms : 40ms))))
**.configurator.config = xmldoc("./configuration_${utenti}_5.xml")

# Campagna con sicurezza: 15 combinazioni per "repeat" ripetizioni.
# -------------------------------------------------------------------------
[Config TrafficoConSicurezza]
extends = TrafficoBase

# --- manopole ---
**.numUe = ${utenti=10}
*.ue2[*].app[0].packetName = "UdpBasicAppData_${traffico=medio}"

# --- valori calcolati dal livello (identici in TrafficoCheck) ---
#                                       basso                            medio                            saturo                           misto
*.ue1[*].app[0].talkPacketSize        = ("${traffico}" == "basso") ? 60B   : (("${traffico}" == "medio") ? 100B : (("${traffico}" == "saturo") ? 160B  : ((ancestorIndex(1) % 3 == 0) ? 60B   : ((ancestorIndex(1) % 3 == 1) ? 100B : 160B))))
*.ue1[*].app[0].packetizationInterval = ("${traffico}" == "basso") ? 60ms  : (("${traffico}" == "medio") ? 20ms : (("${traffico}" == "saturo") ? 20ms  : ((ancestorIndex(1) % 3 == 0) ? 60ms  : 20ms)))
*.ue2[*].app[0].messageLength         = ("${traffico}" == "basso") ? 250B  : (("${traffico}" == "medio") ? 100B : (("${traffico}" == "saturo") ? 1000B : ((ancestorIndex(1) % 3 == 0) ? 250B  : ((ancestorIndex(1) % 3 == 1) ? 100B : 1000B))))
*.ue2[*].app[0].sendInterval          = ("${traffico}" == "basso") ? 1s    : (("${traffico}" == "medio") ? 20ms : (("${traffico}" == "saturo") ? 40ms  : ((ancestorIndex(1) % 3 == 0) ? 1s    : ((ancestorIndex(1) % 3 == 1) ? 20ms : 40ms))))
**.configurator.config = xmldoc("./configuration_${utenti}_5.xml")

# Stessa campagna senza sicurezza: eredita manopole e semi, lo script distingue dall'etichetta.
# -------------------------------------------------------------------------
[Config TrafficoSenzaSicurezza]
extends = TrafficoConSicurezza
**.routing.securityEnabled = false

# =========================================================================
#  FASE E-bis - finalisti NIST LWC: Xoodyak e TinyJAMBU-128
# =========================================================================
# Due varianti che differiscono solo per i semi, in cartelle diverse. Ricostruite
# dai nomi dei file in risultati_aead/: confrontarle con la propria
# [Config AeadConfronto] prima di lanciarle.

# Variante A: nuovi algoritmi in coda, seed-set di [General]. Lanciare solo -r 50..69.
[Config AeadConfrontoLwc]
extends = General
sim-time-limit = 120s
repeat = 1
result-dir = risultati_aead_lwc/
**.routing.typename = "Ant2"
**.routing.securityEnabled = true
**.routing.useCentralAuthority = true
**.routing.aeadAlgorithm = ${aead="ascon128","aes128gcm","aes192gcm","aes256gcm","chacha20poly1305","xoodyak","tinyjambu128"}
**.routing.signatureAlgorithm = "ed25519"
**.vector-recording = false
**.scalar-recording = true
**.routingRecorder.enabled = false

# Variante B: semi 0-9 per entrambi, confronto appaiato con Ascon.
[Config AeadConfrontoLwcAppaiato]
extends = General
sim-time-limit = 120s
repeat = 10
seed-set = ${repetition}
result-dir = risultati_aead_lwc_appaiato/
**.routing.typename = "Ant2"
**.routing.securityEnabled = true
**.routing.useCentralAuthority = true
**.routing.aeadAlgorithm = ${aead="xoodyak","tinyjambu128"}
**.routing.signatureAlgorithm = "ed25519"
**.vector-recording = false
**.scalar-recording = true
**.routingRecorder.enabled = false


# ============================================================================
# CORREZIONI SULL'ENERGIA: configurazioni di prova
# ============================================================================
# EnergiaNormale: correzioni attive. Atteso: percentuali iniziali reali con
# decimali, discesa di ~0,07%/s, nessun drone sotto il 15%.
[Config EnergiaNormale]
extends = General
sim-time-limit = 120s
repeat = 1
result-dir = risultati_energia/EnergiaNormale/
**.routing.scenarioLog = true
**.routing.legacyEnergy = false

# EnergiaLegacy: comportamento originale, per riprodurre i risultati precedenti.
[Config EnergiaLegacy]
extends = General
sim-time-limit = 120s
repeat = 1
result-dir = risultati_energia/EnergiaLegacy/
**.routing.scenarioLog = true
**.routing.legacyEnergy = true
**.adh[*].energyGenerator.typename = ""

# TestRicarica: adh[9] parte al 17%. Atteso: verso i 25-35 s righe ENERGIA, SOS e
# RICARICA, poi RICARICA-FINE al 100% dopo ~30 s; ricaricheCompletate = 1.
[Config TestRicarica]
extends = General
sim-time-limit = 120s
repeat = 1
result-dir = risultati_energia/TestRicarica/
**.routing.scenarioLog = true
**.routing.legacyEnergy = false
**.routing.energyCheckLogAll = true
**.adh[9].energyStorage.initialCapacity = 0.17 * parent.energyStorage.nominalCapacity
# Regola 1: durante e dopo la ricarica adh[9] non deve avere violazioni.

# ----------------------------------------------------------------------------
# REGOLA 1 (energia): configurazioni di prova
# ----------------------------------------------------------------------------
# Risultati: ant2_energia_*.log (ogni controllo), ant2_energia_riepilogo_*.txt
# (totali per drone), scalari controlliEnergiaSuperati / Violati.
#
# TestEnergiaOnesta: nessun attaccante, zero violazioni.
[Config TestEnergiaOnesta]
extends = General
sim-time-limit = 120s
repeat = 1
result-dir = risultati_energia/TestEnergiaOnesta/
**.routing.scenarioLog = true
**.routing.legacyEnergy = false
**.routing.energyCheckLogAll = true

# TestEnergiaAttaccante: adh[7] dichiara sempre energia 100%. Atteso: "calo minimo
# VIOLATO" a ogni finestra da 30 s, ed e' l'unico drone con violazioni.
[Config TestEnergiaAttaccante]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestEnergiaAttaccante/
**.adh[7].routing.attackFalseMetrics = true

# ----------------------------------------------------------------------------
# MisuraTrafficoConsumo: traffico e consumo reale di ogni nodo a ogni misura
# (ant2_traffico_energia_*.log, decine di MB). Solo misura, simulazione identica
# a TestEnergiaOnesta.
[Config MisuraTrafficoConsumo]
extends = TestEnergiaOnesta
result-dir = risultati_energia/MisuraTrafficoConsumo/
**.routing.trafficEnergyLog = true
**.routing.energyCheckLogAll = false

# ----------------------------------------------------------------------------
# TestSnapshot: le GCS lanciano i traceroute e raccolgono lo snapshot della rete
# (ant2_snapshot_*.log, ant2_topologia_*.log). Per il resto come TestEnergiaOnesta.
[Config TestSnapshot]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestSnapshot/
**.gat*.routing.traceEnabled = true
# Snapshot per cluster: ogni GCS traccia il proprio cluster e invia lo
# snapshot alle altre GCS; GCS e satellite inoltrano gli snapshot.
**.gat*.routing.snapshotRelay = true
**.satellite[*].routing.snapshotRelay = true

# --- Regola 5: banda massima ------------------------------------------------
# TestBandaOnesta: nessun attaccante, zero violazioni. Registra anche i superati.
[Config TestBandaOnesta]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestBandaOnesta/
**.routing.bandCheckLogAll = true

# TestBandaFalsa: adh[3] dichiara la banda doppia dal primo BANT. Documenta il LIMITE
# della regola: nessuna violazione, perche' il valore non cambia mai. adh[3] viene
# comunque colto dalla regola 1, che vede l'energia al 100%.
[Config TestBandaFalsa]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestBandaFalsa/
**.adh[3].routing.attackFalseMetrics = true

# TestBandaCambiata: adh[7] onesto all'inizio, poi banda doppia. Atteso: violazione al cambio.
[Config TestBandaCambiata]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestBandaCambiata/
**.adh[7].routing.attackFalseMetrics = true
**.adh[7].routing.attackStart = 60s

# --- Regola 0: coerenza fra canali (impronte pubblicate dalla GCS) ----------
# La GCS raccoglie le stesse letture su due canali (tracce e BANT) e pubblica nel
# cluster l'IMPRONTA di ciascuna, 8 byte invece di 148. Se l'impronta del drone e
# quella della GCS non coincidono, il drone ha dichiarato due cose diverse:
# violazione certa. E' l'unica regola che coglie l'equivocazione.
#
# TestImprontaOnesta: nessun attaccante, zero violazioni. Registra anche i non
# applicabili, che misurano la copertura.
[Config TestImprontaOnesta]
extends = TestSnapshot
result-dir = risultati_energia/TestImprontaOnesta/
**.gat*.routing.digestPublish = true
**.routing.digestCheckLogAll = true

# TestEquivocazione: adh[7] dichiara dal secondo 40 una posizione falsa nei soli BANT
# e quella vera nelle tracce. Atteso: "coerenza fra canali VIOLATO" dai droni e non
# solo dalla GCS; esitiAnnullatiSuperati conta gli esiti ritirati.
[Config TestEquivocazione]
extends = TestSnapshot
result-dir = risultati_energia/TestEquivocazione/
**.gat*.routing.digestPublish = true
**.routing.digestCheckLogAll = true
**.adh[7].routing.attackFakePosition = true
**.adh[7].routing.attackFakePositionOnlyBant = true
**.adh[7].routing.attackFakePositionStart = 40s
**.adh[7].routing.attackFakePositionOffset = 300m

# TestImprontaPunizione: come sopra con la punizione accesa. L'attacco comincia prima
# perche' i reclutamenti avvengono quasi tutti all'inizio: col via al secondo 40 non
# c'erano ancora violazioni da contestare.
[Config TestImprontaPunizione]
extends = TestEquivocazione
result-dir = risultati_energia/TestImprontaPunizione/
**.routing.trustPunishEnabled = true
**.adh[7].routing.attackFakePositionStart = 5s

# ============================================================================
# PROVA FINALE: tutte e sei le regole insieme
# ============================================================================
# TestFinaleOnesto: tutte le regole accese, nessun attaccante. Zero violazioni.
# TestFinaleAttacchi: otto attaccanti insieme, uno per tipo di inganno, sui tre
# cluster. Ogni regola ha il proprio bersaglio; gli altri undici nodi sono il gruppo
# di controllo. Analisi con riepilogo_finale.sh.
#
#   adh[3]  attackFalseMetrics          regola 1 (energia) e regola 5 (banda)
#   adh[5]  attackWrongRecruitMove      regola 2 (posizione)
#   adh[7]  attackFakePositionOnlyBant  regola 0 (equivocazione) e regola 2
#   adh[9]  attackIgnoreRecruit         regola 4 (dubbio)
#   adh[11] attackHopDistance           regola 6 (hop)
#   adh[12] attackFakePosition          regola 2 (geometria)
#   adh[13] attackFalseHelp             regola 4 (falso aiuto)
#   adh[14] attackFalseAvailability     regola 3 (disponibilita')
#
[Config TestFinaleOnesto]
extends = TestSnapshot
result-dir = risultati_energia/TestFinaleOnesto/
**.gat*.routing.digestPublish = true
# Registro completo tranne gli hop, che da soli fanno decine di migliaia di righe.
**.routing.positionCheckLogAll = true
**.routing.availabilityCheckLogAll = true
**.routing.helpCheckLogAll = true
**.routing.bandCheckLogAll = true
**.routing.digestCheckLogAll = true

[Config TestFinaleAttacchi]
extends = TestSnapshot
result-dir = risultati_energia/TestFinaleAttacchi/
**.gat*.routing.digestPublish = true
**.routing.positionCheckLogAll = true
**.routing.availabilityCheckLogAll = true
**.routing.helpCheckLogAll = true
**.routing.bandCheckLogAll = true
**.routing.digestCheckLogAll = true

# Chi mente su un valore parte al secondo 20: i controlli devono vedere prima il valore onesto.
**.adh[3].routing.attackFalseMetrics = true
**.adh[3].routing.attackStart = 20s

**.adh[5].routing.attackWrongRecruitMove = true

**.adh[7].routing.attackFakePosition = true
**.adh[7].routing.attackFakePositionOnlyBant = true
**.adh[7].routing.attackFakePositionStart = 20s
**.adh[7].routing.attackFakePositionOffset = 300m

**.adh[9].routing.attackIgnoreRecruit = true

**.adh[11].routing.attackHopDistance = true

**.adh[12].routing.attackFakePosition = true
**.adh[12].routing.attackFakePositionStart = 20s
**.adh[12].routing.attackFakePositionOffset = 300m

**.adh[13].routing.attackFalseHelp = true

**.adh[14].routing.attackFalseAvailability = true

[Config TestFinaleAttacchiPunizione]
extends = TestFinaleAttacchi
result-dir = risultati_energia/TestFinaleAttacchiPunizione/
**.routing.trustPunishEnabled = true

# --- Regola 6: numero di hop dichiarato -------------------------------------
# Gli hop entrano nel punteggio come 1/H, ma soprattutto nel feromone come 100/hop:
# dichiararne meno del vero significa diventare il prossimo salto preferito per il
# traffico altrui, cioe' un sinkhole.
# attackHopDistance: il nodo non incrementa hopdistance quando inoltra.
#
# TestHopOnesta: nessun attaccante, zero violazioni.
[Config TestHopOnesta]
extends = TestSnapshot
result-dir = risultati_energia/TestHopOnesta/
**.gat*.routing.digestPublish = true
**.routing.hopCheckLogAll = true

# TestHopFalsi: adh[7] non incrementa gli hop. Atteso: il controllo locale lo coglie
# con certezza a ogni inoltro, perche' chi riceve sa che non e' lui il creatore.
[Config TestHopFalsi]
extends = TestSnapshot
result-dir = risultati_energia/TestHopFalsi/
**.gat*.routing.digestPublish = true
**.adh[7].routing.attackHopDistance = true

# TestHopTracce: come sopra, ma ogni GCS traccia anche gli altri cluster. Serve a dare
# catene lunghe al controllo sulle tracce; costa traffico, e' solo una misura.
[Config TestHopTracce]
extends = TestHopFalsi
result-dir = risultati_energia/TestHopTracce/
**.gat*.routing.traceAllClusters = true
**.routing.hopCheckLogAll = true

# --- Metrica di trust: l'attaccante che vince davvero i reclutamenti --------
# Mentire sulla posizione sposta poco il punteggio, quindi la punizione non si vede.
# attackFalseMetrics invece porta il punteggio da 1,16 a 1,69 e vince quasi sempre, ed
# e' colto dalla regola 1: le due prove, identiche tranne l'interruttore, misurano
# quanti reclutamenti vince con e senza punizione.
[Config TestMetricheFalseSenzaPunizione]
extends = TestSnapshot
result-dir = risultati_energia/TestMetricheFalseSenzaPunizione/
**.gat*.routing.digestPublish = true
**.adh[7].routing.attackFalseMetrics = true
**.adh[7].routing.attackStart = 5s

[Config TestMetricheFalseConPunizione]
extends = TestMetricheFalseSenzaPunizione
result-dir = risultati_energia/TestMetricheFalseConPunizione/
**.routing.trustPunishEnabled = true

# --- Regola 4: falso aiuto --------------------------------------------------
# TestFalsoAiutoOnesto: nessun attaccante, zero violazioni. Registra anche i superati.
[Config TestFalsoAiutoOnesto]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestFalsoAiutoOnesto/
**.routing.helpCheckLogAll = true
**.routing.positionCheckLogAll = true

# TestFalsoAiuto: adh[7] accetta il reclutamento e si dichiara non disponibile, ma non
# si sposta. Atteso: una violazione per osservatore oltre l'istante limite.
[Config TestFalsoAiuto]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestFalsoAiuto/
**.adh[7].routing.attackFalseHelp = true

# TestAiutoIgnorato: adh[7] ignora i REQ. Atteso: DUBBIO, perche' non si distingue da
# un drone che il REQ non l'ha mai ricevuto. E' il limite della regola.
[Config TestAiutoIgnorato]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestAiutoIgnorato/
**.adh[7].routing.attackIgnoreRecruit = true

# --- Regola 3: disponibilita' -----------------------------------------------
# TestDisponibilitaOnesta: nessun attaccante, zero violazioni.
[Config TestDisponibilitaOnesta]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestDisponibilitaOnesta/
**.routing.availabilityCheckLogAll = true
**.routing.positionCheckLogAll = true

# TestDisponibilitaAttaccante: adh[7] si dichiara sempre disponibile. Atteso: dal primo
# BANT dopo lo spostamento confermato, una violazione per ogni BANT.
[Config TestDisponibilitaAttaccante]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestDisponibilitaAttaccante/
**.adh[7].routing.attackFalseAvailability = true

# --- Regola 2: posizione ----------------------------------------------------
# TestPosizioneOnesta: nessun attaccante. Solo SUPERATO, piu' DUBBIO se un REQ si perde.
[Config TestPosizioneOnesta]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestPosizioneOnesta/
**.routing.positionCheckLogAll = true

# TestPosizioneSpostamento: adh[7] accetta e si sposta nella direzione opposta. Resta
# fra 40 e 250 m da chi ha chiesto aiuto, ma fuori dalla sfera di 100 m: colto.
[Config TestPosizioneSpostamento]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestPosizioneSpostamento/
**.adh[7].routing.attackWrongRecruitMove = true

# TestPosizioneFalsa: adh[7] dichiara dal secondo 40 una posizione spostata di 300 m. Atteso: DUBBIO.
[Config TestPosizioneFalsa]
extends = TestEnergiaOnesta
result-dir = risultati_energia/TestPosizioneFalsa/
**.adh[7].routing.attackFakePosition = true
**.adh[7].routing.attackFakePositionStart = 40s
**.adh[7].routing.attackFakePositionOffset = 300m

# TestPosizioneFalsaTracce: posizione falsa solo nei BANT e vera nelle tracce. Atteso:
# oltre al DUBBIO, "coerenza della posizione VIOLATO" dalla GCS del suo cluster.
[Config TestPosizioneFalsaTracce]
extends = TestSnapshot
result-dir = risultati_energia/TestPosizioneFalsaTracce/
**.adh[7].routing.attackFakePosition = true
**.adh[7].routing.attackFakePositionOnlyBant = true
**.adh[7].routing.attackFakePositionStart = 40s
**.adh[7].routing.attackFakePositionOffset = 300m

# TestSnapshotEnergiaAttaccante: come TestSnapshot con adh[7] che dichiara energia 100%.
# Verifica la regola 1 anche sulle voci di traccia raccolte dalla GCS.
[Config TestSnapshotEnergiaAttaccante]
extends = TestSnapshot
result-dir = risultati_energia/TestSnapshotEnergiaAttaccante/
**.adh[7].routing.attackFalseMetrics = true

# TestSnapshotHop: come TestSnapshot con adh[6] che non incrementa gli hop: nei percorsi
# che lo attraversano il nodo dopo di lui ha lo stesso valore di h.
[Config TestSnapshotHop]
extends = TestSnapshot
result-dir = risultati_energia/TestSnapshotHop/
**.adh[6].routing.attackHopDistance = true

# --- Regole 2 e 3 con il riferimento ad ancora ------------------------------
# TestAncoraOnesta: nessun attaccante, bollettino dei REQ attivo. Serve a misurare
# quanti controlli per coppia producono ora posizione e disponibilita' e a
# verificare che un drone fermo non generi falsi positivi.
[Config TestAncoraOnesta]
extends = TestSnapshot
result-dir = risultati_energia/TestAncoraOnesta/
**.gat*.routing.digestPublish = true
**.routing.positionCheckLogAll = true
**.routing.availabilityCheckLogAll = true

# TestAncoraPosizione: adh[7] dichiara dal secondo 40 una posizione spostata di 300 m e
# la ripete coerentemente. L'ancora resta alla posizione vera, quindi ogni BANT successivo
# viola: atteso un dubbio per BANT, convertito in violazione certa dal bollettino dei REQ.
[Config TestAncoraPosizione]
extends = TestAncoraOnesta
result-dir = risultati_energia/TestAncoraPosizione/
**.adh[7].routing.attackFakePosition = true
**.adh[7].routing.attackFakePositionStart = 40s
**.adh[7].routing.attackFakePositionOffset = 300m

# TestAncoraDisponibilita: adh[7] si dichiara sempre disponibile. Atteso: una violazione
# per ogni BANT dal primo dopo lo spostamento confermato, non una sola.
[Config TestAncoraDisponibilita]
extends = TestAncoraOnesta
result-dir = risultati_energia/TestAncoraDisponibilita/
**.adh[7].routing.attackFalseAvailability = true

# TestAncoraSenzaBollettino: come TestAncoraPosizione ma le GCS non pubblicano il
# registro dei REQ. Atteso: gli stessi spostamenti restano DUBBI e non vengono mai
# condannati, a dimostrazione che e' il bollettino a trasformarli in certezze.
[Config TestAncoraSenzaBollettino]
extends = TestAncoraPosizione
result-dir = risultati_energia/TestAncoraSenzaBollettino/
**.gat*.routing.digestIncludeReq = false

# --- Regola 0: frequenza di pubblicazione delle impronte --------------------
# TestImprontaFrequente: bollettino a due velocita'. A ogni giro tutte le letture dei
# nodi del proprio cluster, ogni 5 giri anche quelle degli altri. Atteso: i controlli
# sull'impronta per coppia osservatore-drone salgono da circa 4 a oltre 15.
[Config TestImprontaFrequente]
extends = TestAncoraOnesta
result-dir = risultati_energia/TestImprontaFrequente/
**.gat*.routing.digestClusterFirst = true
**.gat*.routing.digestMeasuresPerNode = 2
**.gat*.routing.digestMaxRowsCluster = 12
**.gat*.routing.digestMaxRows = 16
**.gat*.routing.digestMaxReqRows = 4
**.gat*.routing.digestFullEveryRounds = 5
**.routing.digestCheckLogAll = true
**.gat*.routing.digestUnicast = false

# TestImprontaCopie: come TestImprontaFrequente con una copia in piu' di ogni bollettino.
# Le misure dicono che su questo canale il fattore dominante e' la consegna, non la
# frequenza: questa configurazione serve a misurare quanto rende spendere banda in
# ridondanza invece che in righe.
[Config TestImprontaCopie]
extends = TestImprontaFrequente
result-dir = risultati_energia/TestImprontaCopie/
**.gat*.routing.digestCopies = 3
**.gat*.routing.digestUnicast = false

# TestImprontaLenta: stessa simulazione con la pubblicazione precedente, tutte le righe
# in un'unica riserva a rotazione con tetto 12. Serve da riferimento per il confronto.
[Config TestImprontaLenta]
extends = TestAncoraOnesta
result-dir = risultati_energia/TestImprontaLenta/
**.gat*.routing.digestClusterFirst = false
**.gat*.routing.digestMeasuresPerNode = 3
**.gat*.routing.digestMaxRows = 12
**.gat*.routing.digestMaxReqRows = 4
**.routing.digestCheckLogAll = true
**.gat*.routing.digestUnicast = false

# TestImprontaUnicast: il bollettino viene mandato in unicast a ogni vicino del cluster,
# dove il livello MAC riscontra e ritrasmette, piu' una copia in broadcast per gli altri.
# Atteso: ricezioni e controlli sopra TestImprontaCopie, con meno traffico delle tre copie.
[Config TestImprontaUnicast]
extends = TestImprontaFrequente
result-dir = risultati_energia/TestImprontaUnicast/
**.gat*.routing.digestUnicast = true
**.gat*.routing.digestCopies = 2

# TestImprontaPiene: come TestImprontaUnicast ma con quattro letture per nodo in ogni
# bollettino invece di due, e il tetto alzato di conseguenza. Serve a distinguere le due
# cause residue di mancata verifica: se la copertura sale, il limite era quante letture
# la GCS riesce a pubblicare; se resta ferma, il limite e' che la GCS non riceve la
# stessa lettura che ha ricevuto chi controlla, e allora non si puo' fare di meglio.
[Config TestImprontaPiene]
extends = TestImprontaUnicast
result-dir = risultati_energia/TestImprontaPiene/
**.gat*.routing.digestMeasuresPerNode = 4
**.gat*.routing.digestMaxRowsCluster = 24
**.gat*.routing.digestMaxRows = 28
