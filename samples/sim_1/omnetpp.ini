*.Pos.mapy = 1080
*.Pos.mapx2 = 255
*.Pos.mapy2 = 255
*.Pos.emapx = 1080
*.Pos.emapy = 1080

##
## satellite orbit
##
*.satellite[*].NoradModule.TLEfile = "starlink2023.txt"
