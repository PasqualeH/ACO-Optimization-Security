**.configurator.addStaticRoutes = false
**.configurator.addDefaultRoute  = false
**.configurator.optimizeRoutes = false

**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
 
# routing protocol parameters
**.adh[*].routing.typename = "Ant2"
**.adh[*].routing.helloInterval = 5s
**.adh[*].routing.routeLifetime = 5s
**.adh[*].routing.update_pheromone_Interval = 5s
**.adh[*].routing.update_throughput_Interval = 1s
**.adh[*].routing.nominalCapacity = 1 #3   # usato solo con legacyEnergy = true
# false = energia corretta (default), true = comportamento originale; uguale su tutti i nodi.
**.routing.legacyEnergy = false
**.adh[*].routing.chargeThreshold = 15        # % sotto cui il drone va a ricaricarsi
**.adh[*].routing.chargeFullThreshold = 100   # % a cui la ricarica e' completata
# Attesa fra l'avviso di batteria scarica e la partenza per la stazione.
**.adh[*].routing.chargeDepartureDelay = 1s
# Regola 1: controllo sull'energia dichiarata nei BANT e nelle voci di traccia.
**.routing.energyCheckEnabled = true
**.routing.energyCheckWindow = 30s
# D = ritardo massimo di rete: misurato 2,3 s oltre l'intervallo di misura.
**.routing.maxNetworkDelay = 3s
# Prudenza sulla parte di traffico del calo minimo: 0 = solo ascolto radio.
**.routing.energyMinTrafficMargin = 0.5
# Eta' massima del timbro in una voce di traccia (scritta al passaggio, senza ritardo di rete).
**.routing.energyTraceMaxAge = 3.5s
# Regola 2: posizione dichiarata. Ogni spostamento va giustificato da un REQ osservato.
**.routing.positionCheckEnabled = true
**.routing.positionCheckTolerance = 10m
**.routing.positionStillTolerance = 1m
**.routing.positionEventMaxAge = 30s
# Spostamento di reclutamento, come in moveUav(): sfera di 100 m centrata 100 m a nord-est.
**.routing.recruitOffset = 100m
**.routing.recruitRadius = 100m
**.routing.recruitAltitude = 50m
**.routing.recruitMoveDelay = 1s

# Energia iniziale disattivata: la GCS non conosce a priori la batteria di partenza.
**.adh[5].routing.allowed_accept_request = true
**.adh[6].routing.allowed_accept_request = true
